<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">AI Applications — From models to working products</title>
  <desc id="desc">AI application development with LLMs, RAG, agents and voice. Python and TypeScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="65%">
      <stop offset="0" stop-color="#153c4c" stop-opacity=".8"/>
      <stop offset="1" stop-color="#101c30" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8ba9ca" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect x="48" y="48" width="4" height="23" rx="2" fill="#55dfc1"/>
